name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The release app bundles uv; a debug build finds it on the PATH instead.
      - run: brew install uv
      - run: cd app && swift build && .build/debug/Tars --self-check
