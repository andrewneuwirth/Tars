[project]
name = "tars-planner"
version = "0.4.0"
description = "A small, local planner for voice assistants: split a spoken sentence into steps, route each step, pick the skill. Fine-tuned from Von."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "The Tars Authors" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Base model (Von)" = "https://github.com/wfzyx/von"

[tool.setuptools]
packages = ["tars"]
